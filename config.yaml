# ============================================================
# 视频库级语义检索 + 问答 (Video Corpus RAG) 配置
# 架构: 视频切片 -> Qwen3-VL-Embedding-8B 打向量 -> Chroma
#        提问 -> 跨全库混合检索 top-k 切片 -> Qwen3-VL-8B 作答
# ============================================================
# 注意: 本文件路径均为相对项目根目录, 不要写死绝对路径。

paths:                    # 相对项目根; 启动时自动展开为绝对路径
  videos: videos          # 视频库: 把视频文件直接丢进这个目录
  clips: clips            # 自动切好的片段 (按原视频分子目录)
  chroma_db: chroma_db    # 向量库持久化目录
  models: models          # 下载到本地的模型权重
  logs: logs              # 运行日志

models:
  embed_model_id: Qwen/Qwen3-VL-Embedding-8B    # 片段 embedding (Apache-2.0)
  embed_device: "cuda:0"                        # 按你的显卡调整卡号
  vlm_model_id: Qwen/Qwen3-VL-8B-Instruct       # 基于片段问答 (Apache-2.0)
  vlm_device: "cuda:1"                          # 本地兜底模式用的卡; vLLM 模式由 run_vllm.sh 决定

index:
  collection: videosrag           # Chroma 主 collection 名 (视频向量)
  text_collection: videosrag_text # 摘要/结构化描述/语音 文本向量 collection
  seg_len: 6.0                     # 切片长度(秒), 检索返回的最小片段
  overlap: 1.5                     # 相邻切片重叠(秒)
  short_limit: 6.0                 # 只有 <= 该秒数的视频才整体作为 1 个片段
  frames_per_clip: 8               # 每个片段抽多少帧做 embedding
  video_exts: [".mp4", ".avi", ".mov", ".mkv", ".webm", ".flv"]
  clip_crf: 23                    # 切片重编码质量 (越小越清晰)

server:
  host: 0.0.0.0
  port: 8899
  default_top_k: 4                # 默认返回多少个命中片段
  max_top_k: 8                    # vLLM 上下文限制下最多 8 个片段
  vlm_nframes: 8                  # 问答时每个片段送给 VLM 的帧数
  vlm_max_pixels: 245760          # 每帧最大像素(约640x384, 控显存用)
  max_new_tokens: 768
  hybrid: true                    # 混合检索: 视频向量+文本向量(摘要/描述/语音) RRF 融合
  hybrid_candidates: 12           # 每路召回候选数
  hybrid_video_w: 1.0             # 视频路权重
  hybrid_text_w: 0.8              # 文本路权重
  text_weights:                   # 文本路各类型向量权重 (片段内多类型取最优)
    caption: 1.0
    summary: 0.8
    asr: 0.8

enrich:                           # 片段文本侧增强
  caption_enabled: true           # 入库时生成结构化描述 (摘要/对象/动作/场景/画面文字)
  asr_enabled: true               # 入库时语音转文字
  asr_device: "cuda:2"            # faster-whisper 跑在 2 号卡
  asr_model: "large-v3-turbo"     # 可换 medium/small (更省显存更快)

vllm:
  enabled: true                   # true: 问答/摘要走 vLLM 推理服务; false: 进程内 transformers
  base_url: "http://127.0.0.1:8900/v1"  # vLLM OpenAI 兼容端点
  model_name: Qwen3-VL-8B-Instruct      # vLLM 服务启动时声明的模型名
  port: 8900                      # vLLM 服务端口 (run_vllm.sh 用)
  gpu: 1                          # vLLM 占用的 GPU 卡号 (run_vllm.sh 用)
  gpu_memory_utilization: 0.95
  max_model_len: 8192             # 需与 run_vllm.sh 的 --max-model-len 保持一致
